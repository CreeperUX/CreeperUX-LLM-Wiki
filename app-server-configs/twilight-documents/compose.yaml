services:
  renderer:
    image: twilight-studio-doc-designer:0.4.0
    container_name: twilight-renderer
    hostname: twilight-renderer
    init: true
    restart: "no"
    read_only: true
    ports:
      - "10.80.10.182:18080:8080"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
      - /home/node/.cache:rw,nosuid,nodev,size=64m
      - /home/node/.config:rw,nosuid,nodev,size=16m
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      TWILIGHT_BASE_URL: http://127.0.0.1:8080/
      TWILIGHT_AUTH_MODE: internal
      TWILIGHT_INTERNAL_SECRET_FILE: /run/secrets/internal_token
      TWILIGHT_AI_PROVIDER: disabled
      TWILIGHT_AI_ALLOW_CLOUD_PII: "false"
      TWILIGHT_AI_ALLOW_CUSTOM_ENDPOINT: "false"
      TWILIGHT_DATABASE_REQUIRED: "false"
      TWILIGHT_AI_TIMEOUT_MS: "20000"
      TWILIGHT_AI_MAX_CONCURRENT: "2"
      TWILIGHT_AI_MAX_CONCURRENT_XLSX_PARSE: "1"
      TWILIGHT_AI_XLSX_PARSE_TIMEOUT_MS: "10000"
      TWILIGHT_AI_MAX_REQUESTS_PER_MINUTE: "10"
      MAX_EXPORT_BYTES: "10485760"
      PDF_RENDER_TIMEOUT_MS: "30000"
      MAX_CONCURRENT_EXPORTS: "2"
      MAX_EXPORT_QUEUE: "8"
    volumes:
      - /opt/twilight-documents/secrets/internal_token:/run/secrets/internal_token:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - backend

networks:
  backend:
    name: twilight_documents_backend
